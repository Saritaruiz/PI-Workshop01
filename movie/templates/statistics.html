{% block title %}
    Statistics
{% endblock %}

{% block content %}

    <h1>Statistics</h1>

    <h2>Movies per year</h2>

    <img
        src="data:image/png;base64,{{ graphic_year }}"

    <img

        class="img-fluid"
    >

{% endblock %}
