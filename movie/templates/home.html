<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<h1>Welcome to Home Page, {{ name }}</h1>

<form method="get" action="">
    <label for="searchMovie">Buscar película:</label>
    <input type="text" id="searchMovie" name="searchMovie" value="{{ searchTerm|default:'' }}" placeholder="Título de la película" />
    <button type="submit">Buscar</button>
</form>

<h2>Películas</h2>
{% if movies %}
    <ul>
    {% for movie in movies %}
        <li>
            <h3>{{ movie.title }}</h3>
            <p>{{ movie.description }}</p>
            {% if movie.url %}
                <p><img src="{{ movie.url }}" alt="{{ movie.title }}" style="max-width:300px; height:auto;" /></p>
            {% endif %}
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No se encontraron películas.</p>
{% endif %}
