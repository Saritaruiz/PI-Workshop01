<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<h1>Welcome to Home Page, {{ name }}</h1>

<form method="get" action="">
    <div class="mb-3">
        <label for="searchMovie">Buscar película:</label>
        <input type="text" id="searchMovie" name="searchMovie" value="{{ searchTerm|default:'' }}" placeholder="Título de la película" />
    </div>
    <button type="submit" class="btn btn-primary">Buscar</button>
</form>

<h2>Películas</h2>
{% if movies %}
    <div class="row g-4">
    {% for movie in movies %}
        <div class="col-12 col-md-4">
            <div class="card h-100">
                <img src="{{ movie.image.url }}" class="card-img-top" alt="{{ movie.title }}">
                <div class="card-body">
                    <h5 class="card-title">{{ movie.title }}</h5>
                    <p class="card-text">{{ movie.description }}</p>
                    {% if movie.url %}
                        <a href="{{ movie.url }}" class="btn btn-primary">Movie Link</a>
                    {% endif %}
                </div>
            </div>
        </div>
    {% endfor %}
    </div>
{% else %}
    <p>No se encontraron películas.</p>
{% endif %}
</body>
</html>
